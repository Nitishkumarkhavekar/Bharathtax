# ============================================================================
# BharathTax — web-app-only deployment
# Excludes:
#   - ml-server  (embeddings/reranker — provide via remote LiteLLM if needed)
#   - the local LLM (Ollama/vLLM — backend points at remote LiteLLM via .env)
# Includes:
#   - frontend (Vite dev server on :5173)
#   - api (FastAPI on :8000)
#   - worker, beat (Celery)
#   - postgres, redis, minio  (internal-only, no host port exposure)
#
# Usage:
#   cp .env.example .env   # then edit LLM_BASE_URL / LLM_API_KEY
#   docker-compose -f docker-compose.web.yml up -d --build
# ============================================================================
version: "3.9"
name: bharathtax-web

x-backend-env: &backend-env
  env_file: [.env]

services:
  # ---------------------------------------------------------------------------
  # litellm-tunnel-relay
  # The SSH reverse tunnel from the gpubox binds 127.0.0.1:14000 on this host
  # (sshd's GatewayPorts=no). Containers reach the host through the docker
  # bridge IP (172.17.0.1), not loopback, so they can't hit that port directly.
  # This socat relay runs with host networking and listens on 172.17.0.1:14000,
  # forwarding to 127.0.0.1:14000 so the api/worker containers can reach
  # LiteLLM via host.docker.internal:14000.
  # ---------------------------------------------------------------------------
  litellm-tunnel-relay:
    image: alpine/socat:latest
    restart: unless-stopped
    network_mode: host
    command: >
      -d TCP-LISTEN:14000,bind=172.17.0.1,fork,reuseaddr
      TCP:127.0.0.1:14000

  # ---------------------------------------------------------------------------
  # OnlyOffice Document Server — Word-style web editor used by Module 6's Edit
  # mode. Browser hits https://bharattax.wenvia.global/oo/ which nginx proxies
  # to 127.0.0.1:8095 → this container. OnlyOffice itself talks back to the
  # api container over the internal docker network (so download / save
  # callbacks don't depend on public DNS).
  # ---------------------------------------------------------------------------
  documentserver:
    image: onlyoffice/documentserver:8.0
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${OO_JWT_SECRET}
      JWT_HEADER: "AuthorizationJwt"
      USE_UNAUTHORIZED_STORAGE: "false"
    volumes:
      - oo_data:/var/www/onlyoffice/Data
      - oo_log:/var/log/onlyoffice
      - oo_cache:/var/lib/onlyoffice
    ports:
      - "127.0.0.1:8095:80"

  # ---------------------------------------------------------------------------
  # previewer: headless LibreOffice that converts the generated draft .docx
  # into a PDF for the Module 6 in-page preview. Only the api container talks
  # to it via the docker network; no host port exposure.
  # ---------------------------------------------------------------------------
  previewer:
    build: ./previewer
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python3 -c 'import urllib.request,sys;sys.exit(0 if urllib.request.urlopen(\"http://localhost:5151/health\",timeout=3).status==200 else 1)'"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips="*"
    restart: unless-stopped
    <<: *backend-env
    ports: ["127.0.0.1:8000:8000"]   # nginx (host) proxies /api/ -> here
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach the SSH tunnel on host loopback
    volumes:
      - ./backend:/app
      - ./config:/app/config:ro
      - ./data:/data
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}

  worker:
    build: ./backend
    # Threads pool + higher concurrency: Gemini calls are 100% I/O-bound, so
    # threads scale much cheaper than prefork (one process, one connection
    # pool). Sizing: 12 concurrent pipeline tasks x per-run parallelism
    # (Module 5 fans out up to 6 issues) is bounded by the shared Gemini
    # semaphore (GEMINI_CONCURRENCY), which prevents rate-limit storms.
    command: celery -A app.ingestion.tasks.celery_app worker --loglevel=INFO --pool=threads --concurrency=12
    restart: unless-stopped
    <<: *backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./config:/app/config:ro
      - ./data:/data
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}

  beat:
    build: ./backend
    command: celery -A app.ingestion.tasks.celery_app beat --loglevel=INFO
    restart: unless-stopped
    <<: *backend-env
    volumes:
      - ./backend:/app
      - ./config:/app/config:ro
      - ./data:/data
    depends_on:
      redis: {condition: service_healthy}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    ports: ["127.0.0.1:5173:80"]   # nginx (host) proxies / -> here
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
  oo_data:
  oo_log:
  oo_cache:
