# ============================================================================
# BharathTax — SOURCE REGISTRY
# ----------------------------------------------------------------------------
# Adding a source = editing THIS file, never code (hard requirement).
# The ingestion pipeline reads this, upserts each entry into `corpus_sources`,
# and processes it. Sources that can't be fetched automatically
# (blocked/rate-limited) are dropped into MANUAL_DROP_DIR and ingested the same
# way via the `manual` fetcher.
#
# `domain` is the multi-tenant axis (the taxmann.ai "Module" concept):
# income_tax | gst | customs | company_law | ...  Only `income_tax` is in the
# MVP corpus; the others are reserved extension points (commented out).
# ============================================================================

defaults:
  rate_limit_seconds: 3          # polite crawl floor; overridable per source
  cache: true                    # cache fetched bytes so re-runs don't re-hit the site
  keep_raw: true                 # always retain raw file in MinIO

sources:
  # ----------------------------- INCOME TAX (MVP) ---------------------------
  - key: it_act_1961
    domain: income_tax
    name: Income Tax Act, 1961
    source_type: act             # act | rule | circular | notification
    fetcher: manual              # manual | http_html | http_pdf  (seed via /data/manual)
    base_url: https://incometaxindia.gov.in/pages/acts/income-tax-act.aspx
    manual_glob: "income_tax/act_1961/**/*"   # under MANUAL_DROP_DIR
    parser: it_act               # legal-structure parser profile
    enabled: true

  - key: it_act_2025
    domain: income_tax
    name: Income-tax Act, 2025
    source_type: act
    fetcher: manual
    base_url: https://incometaxindia.gov.in/pages/acts/income-tax-act.aspx
    manual_glob: "income_tax/act_2025/**/*"
    parser: it_act
    enabled: true

  - key: it_rules_1962
    domain: income_tax
    name: Income Tax Rules, 1962
    source_type: rule
    fetcher: manual
    base_url: https://incometaxindia.gov.in/pages/rules/income-tax-rules-1962.aspx
    manual_glob: "income_tax/rules_1962/**/*"
    parser: it_rules
    enabled: true

  - key: it_rules_2026
    domain: income_tax
    name: Income-tax Rules, 2026
    source_type: rule
    fetcher: manual
    base_url: https://incometaxindia.gov.in/pages/rules/income-tax-rules-1962.aspx
    manual_glob: "income_tax/rules_2026/**/*"
    parser: it_rules
    enabled: true

  - key: cbdt_circulars_recent
    domain: income_tax
    name: CBDT Circulars (recent)
    source_type: circular
    fetcher: manual              # flip to http_html once crawler is validated
    base_url: https://incometaxindia.gov.in/Pages/communications/circulars.aspx
    manual_glob: "income_tax/circulars/**/*"
    parser: cbdt_circular
    rate_limit_seconds: 5
    enabled: true

  - key: cbdt_notifications_recent
    domain: income_tax
    name: CBDT Notifications (recent)
    source_type: notification
    fetcher: manual
    base_url: https://incometaxindia.gov.in/Pages/communications/notifications.aspx
    manual_glob: "income_tax/notifications/**/*"
    parser: cbdt_notification
    rate_limit_seconds: 5
    enabled: true

  - key: finance_acts
    domain: income_tax
    name: Finance Acts (annual)
    source_type: act
    fetcher: manual
    base_url: https://www.incometaxindia.gov.in/finance-acts
    manual_glob: "income_tax/acts_new/finance_act_*.txt"
    parser: act_sections
    enabled: true

  - key: it_act_2025_structured
    domain: income_tax
    name: Income-tax Act, 2025
    source_type: act
    fetcher: manual
    base_url: https://www.incometaxindia.gov.in/income-tax-act-2025
    manual_glob: "income_tax/acts_new/income_tax_act_2025.txt"
    parser: act_sections
    enabled: true

  - key: allied_direct_tax_acts
    domain: income_tax
    name: Allied direct-tax acts (Wealth-Tax, Benami, STT, CTT, Equalisation Levy, Expenditure-Tax, Gift-Tax)
    source_type: act
    fetcher: manual
    base_url: https://www.incometaxindia.gov.in/all-acts
    manual_glob: "income_tax/allied_acts/*.txt"
    parser: act_sections
    enabled: true

  - key: dtaa_treaties
    domain: income_tax
    name: Double Taxation Avoidance Agreements (tax treaties)
    source_type: act
    fetcher: manual
    base_url: https://www.incometaxindia.gov.in/dtaa
    manual_glob: "income_tax/dtaa/*.txt"
    parser: treaty_sections
    enabled: true

  - key: finance_bill_explanatory
    domain: income_tax
    name: Finance Bill Memorandum + Notes on Clauses (legislative intent, 2000-2026)
    source_type: act
    fetcher: manual
    base_url: https://www.incometaxindia.gov.in/finance-bills
    manual_glob: "income_tax/finance_bills/*.txt"
    parser: finance_bill
    enabled: true

  - key: it_rules_complete
    domain: income_tax
    name: Income-tax Rules (complete)
    source_type: rule
    fetcher: manual
    base_url: https://www.incometaxindia.gov.in/income-tax-rules
    manual_glob: "income_tax/rules_new/income_tax_rules.txt"
    parser: rule_sections
    enabled: true

  - key: it_rules_2026
    domain: income_tax
    name: Income-tax Rules, 2026
    source_type: rule
    fetcher: manual
    base_url: https://www.incometaxindia.gov.in/income-tax-rules
    manual_glob: "income_tax/rules_new/income_tax_rules_2026.txt"
    parser: rule_sections
    enabled: true

  # ----------------------- RESERVED EXTENSION POINTS ------------------------
