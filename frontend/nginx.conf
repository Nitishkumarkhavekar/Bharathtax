server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Standard SPA fallback: serve index.html for unknown paths so React Router works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aggressive caching for hashed assets.
    location /assets/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Don't cache index.html so deploys are immediately visible.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
