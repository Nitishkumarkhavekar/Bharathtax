# ============================================================================
# BharathTax — GPU production override.
# Usage:  docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
# Adds vLLM serving the production LLM and moves ML models onto the GPU.
# Set in .env:  LLM_BACKEND=vllm  LLM_BASE_URL=http://llm:8000/v1
#               LLM_MODEL_NAME=Qwen/Qwen2.5-14B-Instruct  ML_DEVICE=cuda
# Requires NVIDIA Container Toolkit. NOT for the 4GB T1200 laptop GPU.
# ============================================================================
services:
  llm:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    command: >
      --model ${LLM_MODEL_NAME}
      --served-model-name ${LLM_MODEL_NAME}
      --max-model-len 8192
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    ports: ["8000"]
    volumes:
      - hfcache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ml-server:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
