[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bharathtax-backend"
version = "0.1.0"
description = "BharathTax — self-hosted, citation-grounded tax-law RAG (backend + ingestion)"
requires-python = ">=3.11,<3.13"
dependencies = [
    # --- web / api ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",       # file uploads
    # --- db ---
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    # --- auth ---
    "bcrypt>=4.1",
    "pyjwt>=2.10",
    # --- async jobs ---
    "celery>=5.4",
    "redis>=5.2",
    # --- storage ---
    "minio>=7.2",
    # --- ingestion / parsing ---
    "pyyaml>=6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "pymupdf>=1.24",                   # text PDFs
    "pytesseract>=0.3.13",             # OCR fallback (scanned only)
    "pillow>=11.0",
    # --- ml client (no heavy torch here; that lives in ml-server) ---
    "numpy>=2.0",
    # --- appeal-order drafting ---
    "python-docx>=1.1",               # DOCX export of draft orders
    # --- admin console: system stats ---
    "psutil>=5.9",
    # --- Vertex AI backend: mint OAuth tokens from the service-account JSON
    # (bundles pure-Python rsa; no cryptography needed) ---
    "google-auth>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
