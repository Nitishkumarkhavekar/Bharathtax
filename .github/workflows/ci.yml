name: CI

on:
  push:
    branches: [master, "feat/**", "fix/**"]
  pull_request:
    branches: [master]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tooling
        run: pip install ruff

      # Catches real bugs (undefined names / unused imports / syntax) — e.g. the
      # `case` NameError that broke the OnlyOffice endpoints. Not a style gate.
      - name: Ruff (bug rules only)
        run: ruff check --select E9,F63,F7,F82,F821,F811 backend/app scripts

      - name: Python compiles
        run: python -m compileall -q backend/app scripts

      # Alembic must have exactly ONE head, or `alembic upgrade head` fails.
      - name: Alembic single-head
        run: |
          python - <<'PY'
          import re, glob, sys
          revs = {}
          for f in glob.glob('backend/alembic/versions/*.py'):
              t = open(f, encoding='utf-8').read()
              r = re.search(r"^revision = '([^']+)'", t, re.M)
              d = re.search(r"^down_revision = '([^']+)'", t, re.M)
              if r:
                  revs[r.group(1)] = d.group(1) if d else None
          downs = {v for v in revs.values() if v}
          heads = [r for r in revs if r not in downs]
          if len(heads) != 1:
              print("Alembic has multiple heads:", heads); sys.exit(1)
          print("OK single head:", heads[0])
          PY

      # Fail if a secret file is tracked or an obvious key pattern is committed.
      - name: Secret guard
        run: |
          if git ls-files | grep -E '(^|/)\.secrets/' ; then
            echo "::error::A .secrets/ file is tracked in git"; exit 1; fi
          if git grep -nE 'AIza[0-9A-Za-z_\-]{30,}|AQ\.[A-Za-z0-9]{20,}' -- ':!*.example' ':!**/CI*' ; then
            echo "::error::A Google API key pattern is committed"; exit 1; fi
          echo "OK no tracked secrets"

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend (with test deps)
        run: pip install "./backend[dev]"
      - name: Pytest (pure logic + DB-integration on SQLite)
        working-directory: backend
        run: |
          python -m pytest -q \
            app/tests/test_limitation.py \
            app/tests/test_calculators.py \
            app/tests/test_reconcile.py \
            app/tests/test_workspace_integration.py \
            app/tests/test_chunker.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build web frontend
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build
