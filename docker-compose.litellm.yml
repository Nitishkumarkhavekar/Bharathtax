# ============================================================================
# BharathTax — LiteLLM gateway (OpenAI-compatible) + its own Postgres (for
# virtual keys, spend tracking, rate limits). Fronts the RAG API (:8080) and
# vLLM (:8002) on the host.
#
#   docker compose -f docker-compose.litellm.yml up -d
#   Gateway: http://<THIS_VPS_IP>:4000   (OpenAI base_url = .../v1)
#
# Postgres here is INTERNAL to this compose (not host-published) so it can't
# clash with other 5432 containers on the box.
# ============================================================================
name: bharattax-litellm

services:
  litellm-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD}
    volumes:
      - litellm_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 12

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    depends_on:
      litellm-db: {condition: service_healthy}
    ports: ["127.0.0.1:4000:4000"]   # localhost only — public access is via nginx/443
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm
      BHARATTAX_API_KEY: ${BHARATTAX_API_KEY}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]

volumes:
  litellm_pg:
